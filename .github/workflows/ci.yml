name: CI

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ruff, the format check, and pytest run inside the Containerfile's checks
      # stage, built by Buildah from its pinned quay.io image rather than the
      # runner's distro package.
      - name: Lint and test with Buildah
        env:
          BUILDAH_IMAGE: quay.io/buildah/stable:v1.43.5@sha256:baaa8fe50d0e78687fa39ef90d5afcea07a6bec086dfdef99f792b555f98fbcd
        run: >-
          podman run --rm --privileged
          --volume "$PWD:/src:ro" --workdir /src
          "$BUILDAH_IMAGE"
          buildah build --storage-driver vfs --file Containerfile --target checks .

  package:
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create extension zip
        run: |
          zip -r planetopbr.zip \
            __init__.py \
            blender_manifest.toml \
            README.md \
            LICENSE \
            scripts

      - name: Validate zip structure
        run: |
          unzip -l planetopbr.zip

          if unzip -l planetopbr.zip | grep -q "PlaneToPBR-main"; then
            echo "Zip contains nested repository folder"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: planetopbr-extension
          path: planetopbr.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: planetopbr-extension

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: planetopbr.zip
