name: CI

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lint.txt

      - name: Install Ruff
        run: python -m pip install -r requirements-lint.txt

      - name: Run Ruff
        run: ruff check .

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test image with Buildah
        run: |
          sudo buildah build --pull=always --no-cache --target test \
            --tag "localhost/planetopbr-test:${{ github.sha }}" .

      - name: Run tests
        run: |
          test_container=$(sudo buildah from "localhost/planetopbr-test:${{ github.sha }}")
          trap 'sudo buildah rm "$test_container"' EXIT
          sudo buildah run "$test_container" -- python -m pytest -v

  package:
    runs-on: ubuntu-latest
    needs: [ruff, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create extension zip
        run: |
          zip -r planetopbr.zip \
            __init__.py \
            blender_manifest.toml \
            README.md \
            LICENSE \
            scripts

      - name: Validate zip structure
        run: |
          unzip -l planetopbr.zip

          if unzip -l planetopbr.zip | grep -q "PlaneToPBR-main"; then
            echo "Zip contains nested repository folder"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: planetopbr-extension
          path: planetopbr.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: planetopbr-extension

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: planetopbr.zip
